<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portal de Vendas Jaguar</title><style>
:root{--o1:#b8400f;--o2:#f97316;--bg:#fffaf5;--tx:#1f1b16;--mu:#6b625a;--card:#fff;--bd:#eee3d8;--gr:#22c55e;--lg:#dfe9df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1512;--tx:#f5ede4;--mu:#b5a99c;--card:#262019;--bd:#3a3128;--lg:#1d2a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1512;--tx:#f5ede4;--mu:#b5a99c;--card:#262019;--bd:#3a3128;--lg:#1d2a20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.hero{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;padding:20px 16px 44px}
.w{max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid #fff3}
.top b{font-size:15px;letter-spacing:.3px}.top small{display:block;font-size:11px;opacity:.85}
.logo{width:36px;height:36px;border-radius:10px;background:#fff3;display:grid;place-items:center;font-size:18px}
.menu{margin-left:auto;background:#fff2;border:1px solid #fff5;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.hero h1{text-align:center;font-size:clamp(26px,5vw,40px);margin:26px 0 10px}
.hero p{text-align:center;max-width:560px;margin:0 auto 22px;font-size:14px;opacity:.95;line-height:1.5}
.bar{background:var(--card);color:var(--tx);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:780px;margin:0 auto;box-shadow:0 8px 24px #0003}
.bar input,.bar select,.bar button,.f input,.f select,.f textarea{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px;font-size:14px}
.bar input{flex:1 1 200px}.bar button{cursor:pointer;font-weight:600}
.sec{padding:26px 16px}.sh{display:flex;justify-content:space-between;align-items:end;gap:8px;border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:20px}
.sh h2{margin:0;font-size:22px}.sh p{margin:4px 0 0;color:var(--mu);font-size:13px}
.pill{background:#f973161a;color:#c2410c;border:1px solid #f9731655;border-radius:99px;padding:3px 10px;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0001;cursor:pointer;display:flex;flex-direction:column}
.card .im{position:relative;height:160px;background:#f3e6d8 center/cover}
.tag{position:absolute;top:10px;left:10px;background:#fffe;color:#c2410c;border-radius:99px;font-size:11px;padding:3px 9px}
.cb{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}.cb h3{margin:0;font-size:17px}.cb p{margin:0;color:var(--mu);font-size:13px;line-height:1.45}
.info{border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;display:grid;gap:6px;color:var(--mu)}
.wa{display:block;text-align:center;background:var(--gr);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:600;text-decoration:none;cursor:pointer;font-size:14px}
.lk{text-align:center;color:#c2410c;font-size:12px;font-weight:600}
.pg{background:var(--lg);min-height:100vh;padding:20px 14px}
.ban{position:relative;height:clamp(160px,32vw,320px);border-radius:20px;background:#ccc center/cover;overflow:hidden}
.back{position:absolute;top:14px;left:14px;background:#fff;color:#111;border:0;border-radius:99px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:20px;align-items:start}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px #0001}.box h3{margin:0 0 10px;font-size:16px}.box p{color:var(--mu);font-size:14px;line-height:1.5;margin:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}.gal img{width:100%;height:110px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.row{margin:12px 0;font-size:14px}.row small{display:block;color:var(--mu);font-size:11px}.row a{color:#15803d;font-size:12px}
.ad{padding:20px 14px;max-width:1000px;margin:0 auto}.ad h2{margin:0 0 14px}
.f{display:grid;gap:10px}.f label{font-size:12px;color:var(--mu);display:grid;gap:4px}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.f .two{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#dc2626}
.lr{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);flex-wrap:wrap}.lr img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eee}.lr .g{flex:1;min-width:140px}
.ib{flex:1;background:#f973160f;border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}.ib b{display:block;font-size:24px;color:var(--tx)}.off{opacity:.55}.msg{padding:30px;text-align:center;color:var(--mu)}.err{color:#dc2626;font-size:13px}
.th{display:flex;gap:6px;flex-wrap:wrap}.th div{position:relative}.th img{width:70px;height:70px;object-fit:cover;border-radius:8px}.th b{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;cursor:pointer}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}img{max-width:100%}.card h3,.cb p,.info span,.row,.lr .g,.box p{overflow-wrap:anywhere}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,.btn,.wa,.menu,.back{min-height:42px}.card{transition:transform .15s,box-shadow .15s}@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}}
.ad>div:first-child{row-gap:8px}.ad .btn{flex:0 0 auto}
@media(max-width:900px){.grid{gap:16px}.hero{padding-bottom:36px}.ad{padding:16px 12px}}
@media(max-width:600px){.hero{padding:14px 12px 30px}.hero h1{margin:20px 0 8px}.hero p{font-size:13px;margin-bottom:16px}.top b{font-size:13px}.menu{padding:8px 10px}
.bar{padding:8px;gap:8px}.bar input,.bar select,.bar button{flex:1 1 100%;width:100%}
.sec{padding:20px 12px}.sh{flex-direction:column;align-items:flex-start}.sh h2{font-size:19px}
.grid{grid-template-columns:1fr}.card .im{height:180px}
.pg{padding:12px 10px}.ban{border-radius:14px}.box{padding:16px;border-radius:14px;margin-bottom:14px}.cols{gap:14px;margin-top:14px}
.gal{grid-template-columns:repeat(2,1fr)}.gal img{height:120px}
.lr .btn{flex:1 1 calc(50% - 10px);padding:10px 8px;font-size:13px}.lr .g{flex:1 1 100%}
.f input,.f select,.f textarea,.bar input,.bar select{font-size:16px}
.ad h2{font-size:20px}.th img{width:60px;height:60px}}
@media(max-width:360px){.top small{display:none}.hero h1{font-size:23px}}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}#lb img{max-width:92vw;max-height:90vh;border-radius:8px}
</style></head><body><div id="app"><div class="msg">Carregando portal…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hgvojvbxuxgpcehrkgsj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_WvDzAh4iE0V7CXTpeKCM6A__Lf-isa3';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const app=document.getElementById('app');let lojas=[],cats=[],user=null,draft=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');const go=h=>location.hash=h;
const fileUrl=p=>sb.storage.from('fotos_lojas').getPublicUrl(p).data.publicUrl;
function norm(r){return {...r,cat:r.categoria||'',desc:r.descricao||'',end:r.endereco||'',horario:r.horario_atendimento||'',insta:r.instagram||'',logo:r.imagem_card||'',banner:r.Banner||'',wpp:r.telefone_whatsapp||'',tel:r.telefone_whatsapp||'',galeria:Array.isArray(r.galeria)?r.galeria:(()=>{try{return JSON.parse(r.galeria||'[]')}catch{return []}})()};}
async function load(){let [a,b]=await Promise.all([sb.from('Lojas').select('*').order('nome'),sb.from('categorias').select('*').order('categoria')]);if(a.error)throw a.error;if(b.error)throw b.error;lojas=a.data.map(norm);cats=b.data.map(x=>({id:x.id,nome:x.categoria}));}
async function isAdmin(){const {data:{user:u}}=await sb.auth.getUser();user=u;if(!u)return false;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();return !error&&!!data;}
async function init(){try{await load();render()}catch(e){app.innerHTML='<div class="msg">Falha ao conectar ao Supabase: '+esc(e.message)+'</div>'}}
addEventListener('hashchange',render);
function render(){const h=decodeURIComponent(location.hash.slice(1));if(h==='login')return login();if(h==='admin')return admin();if(h==='novo')return form(null);if(h.startsWith('edit-'))return form(h.slice(5));if(h.startsWith('loja-'))return detail(h.slice(5));home();}
function home(){let list=lojas.filter(x=>x.ativo!==false);app.innerHTML=`<header class="hero"><div class="w"><div class="top"><div class="logo">🛍️</div><div><b>PORTAL DE VENDAS JAGUAR</b><small>Encontre lojas e serviços da região</small></div><button class="menu" onclick="go('login')">Área administrativa</button></div><h1>Encontre o que você procura</h1><p>Conheça os estabelecimentos e entre em contato diretamente pelo WhatsApp.</p><div class="bar"><input id="q" placeholder="Buscar estabelecimento…" oninput="filterCards()"><select id="cat" onchange="filterCards()"><option value="">Todas as categorias</option>${cats.map(c=>`<option>${esc(c.nome)}</option>`).join('')}</select></div></div></header><section class="sec w"><div class="sh"><div><h2>Estabelecimentos</h2><p>Conheça as opções disponíveis</p></div><span class="pill">${list.length} lojas</span></div><div class="grid" id="cards">${list.map(card).join('')||'<div class="msg">Nenhuma loja cadastrada ainda.</div>'}</div></section>`;}
function card(l){return `<article class="card" data-name="${esc((l.nome+' '+l.cat).toLowerCase())}" data-cat="${esc(l.cat)}" onclick="go('loja-${l.id}')"><div class="im" style="${l.logo?`background-image:url('${esc(l.logo)}')`:''}"></div><div class="cb"><span class="pill">${esc(l.cat)}</span><h3>${esc(l.nome)}</h3><p>${esc(l.desc)}</p><div class="info"><span>📍 ${esc(l.end)}</span></div></div></article>`}
function filterCards(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value;document.querySelectorAll('#cards .card').forEach(e=>e.style.display=(e.dataset.name.includes(q)&&(!c||e.dataset.cat===c))?'':'none')}
function detail(id){let l=lojas.find(x=>String(x.id)===String(id));if(!l){home();return}let phone=digits(l.wpp);app.innerHTML=`<div class="pg"><div class="w"><div class="ban" style="${l.banner?`background-image:url('${esc(l.banner)}')`:''}"><button class="back" onclick="go('')">← Voltar</button></div><div class="cols"><main><div class="box"><h2>${esc(l.nome)}</h2><span class="pill">${esc(l.cat)}</span><p>${esc(l.desc)}</p></div><div class="box"><h3>Galeria</h3><div class="gal">${l.galeria.map(u=>`<img src="${esc(u)}" onclick="window.open(this.src,'_blank')">`).join('')}</div></div></main><aside><div class="box"><h3>Informações</h3><div class="row">📍 ${esc(l.end)}</div><div class="row">🕒 ${esc(l.horario)}</div>${l.insta?`<div class="row">Instagram: ${esc(l.insta)}</div>`:''}<a class="wa" target="_blank" href="https://wa.me/55${phone}" onclick="event.stopPropagation();registrar(${l.id},'conversa')">Conversar pelo WhatsApp</a></div></aside></div></div></div>`;registrar(Number(id),'visita')}
async function registrar(id,tipo){let key='pvj_visitante';let v=localStorage.getItem(key);if(!v){v=crypto.randomUUID();localStorage.setItem(key,v)}let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));await sb.rpc('registrar_evento_loja',{p_loja_id:id,p_tipo:tipo,p_visitante_hash:hash});}
function login(){app.innerHTML=`<div class="ad" style="max-width:420px"><button class="btn s" onclick="go('')">← Voltar</button><h2>Entrar como administrador</h2><form class="f" id="lf"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div class="err" id="er"></div><button class="btn">Entrar</button></form></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();let er=document.getElementById('er');let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){er.textContent='Não foi possível entrar: '+error.message;return}if(!await isAdmin()){await sb.auth.signOut();er.textContent='Este usuário não está autorizado como administrador.';return}await load();go('admin')};}
async function admin(){if(!await isAdmin()){go('login');return}await load();app.innerHTML=`<div class="ad"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="flex:1">Painel administrativo</h2><button class="btn s" onclick="go('')">Ver portal</button><button class="btn s" onclick="sair()">Sair</button></div><button class="btn" onclick="go('novo')">+ Nova loja</button><div class="box"><h3>Categorias</h3><div style="display:flex;gap:8px"><input id="nc" placeholder="Nova categoria"><button class="btn" onclick="addCat()">Adicionar</button></div>${cats.map(c=>`<div class="lr"><div class="g">${esc(c.nome)}</div><button class="btn d" onclick="delCat(${c.id})">Excluir</button></div>`).join('')}</div>${lojas.map(l=>`<div class="lr"><img src="${esc(l.logo)}"><div class="g"><b>${esc(l.nome)}</b><small>${esc(l.cat)}</small></div><button class="btn s" onclick="go('edit-${l.id}')">Editar</button><button class="btn d" onclick="delLoja(${l.id})">Excluir</button></div>`).join('')}</div>`;}
async function sair(){await sb.auth.signOut();user=null;go('')}
async function addCat(){let n=document.getElementById('nc').value.trim();if(!n)return;let {error}=await sb.from('categorias').insert({categoria:n});if(error)alert(error.message);else admin()}
async function delCat(id){if(!confirm('Excluir categoria?'))return;let {error}=await sb.from('categorias').delete().eq('id',id);if(error)alert(error.message);else admin()}
async function delLoja(id){if(!confirm('Excluir esta loja?'))return;let {error}=await sb.from('Lojas').delete().eq('id',id);if(error)alert(error.message);else admin()}
function form(id){let l=id?lojas.find(x=>String(x.id)===String(id)):null;draft=l?{...l,galeria:[...l.galeria]}:{ativo:true,galeria:[]};app.innerHTML=`<div class="ad"><button class="btn s" onclick="go('admin')">← Voltar</button><h2>${id?'Editar':'Nova'} loja</h2><form class="f" id="sf"><label>Nome<input name="nome" required value="${esc(draft.nome)}"></label><label>Categoria<select name="categoria" required><option value="">Selecione</option>${cats.map(c=>`<option ${c.nome===draft.cat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Descrição<textarea name="descricao">${esc(draft.desc)}</textarea></label><label>Endereço<input name="endereco" value="${esc(draft.end)}"></label><label>Telefone / WhatsApp<input name="telefone_whatsapp" value="${esc(draft.wpp)}" required></label><label>Horário<input name="horario_atendimento" value="${esc(draft.horario)}"></label><label>Instagram<input name="instagram" value="${esc(draft.insta)}"></label><label>Imagem do card<input type="file" id="logo" accept="image/*"></label><label>Banner<input type="file" id="banner" accept="image/*"></label><label>Fotos da galeria<input type="file" id="galeria" accept="image/*" multiple></label><label><input type="checkbox" name="ativo" ${draft.ativo!==false?'checked':''}> Loja ativa</label><div class="err" id="er"></div><button class="btn">Salvar loja</button></form></div>`;document.getElementById('sf').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,fd=new FormData(f),d=Object.fromEntries(fd.entries());d.ativo=f.ativo.checked;let folder=(draft.nome||d.nome||'loja').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');async function upload(input,sub){let file=document.getElementById(input).files[0];if(!file)return null;let path=`${folder}/${sub}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error}=await sb.storage.from('fotos_lojas').upload(path,file,{upsert:true});if(error)throw error;return fileUrl(path)}try{let logo=await upload('logo','imagem_card'),banner=await upload('banner','banner');let gal=[...draft.galeria];for(let file of document.getElementById('galeria').files){let path=`${folder}/galeria/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error}=await sb.storage.from('fotos_lojas').upload(path,file,{upsert:true});if(error)throw error;gal.push(fileUrl(path))}d.imagem_card=logo||draft.logo||null;d.Banner=banner||draft.banner||null;d.galeria=JSON.stringify(gal);let result=id?await sb.from('Lojas').update(d).eq('id',id):await sb.from('Lojas').insert(d);if(result.error)throw result.error;await admin();}catch(err){document.getElementById('er').textContent='Erro ao salvar: '+err.message}}}
init();
</script></body></html>
